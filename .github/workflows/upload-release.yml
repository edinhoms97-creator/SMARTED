name: Build and Upload APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          yes | sdkmanager "build-tools;35.0.0" "platforms;android-34" 2>&1 | tail -5

      - name: Download apktool
        run: |
          mkdir -p .cache
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" -o .cache/apktool.jar
          curl -sL "https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool" -o .cache/apktool
          chmod +x .cache/apktool
          echo "APKTOOL=$PWD/.cache/apktool.jar" >> $GITHUB_ENV
          echo "PATH=$PWD/.cache:$PATH" >> $GITHUB_ENV

      - name: Download base APK from Dropbox
        run: |
          mkdir -p .cache/base dist .cache/work
          # Use the Dropbox share link from base-apk.json
          DROPBOX_URL="https://www.dropbox.com/scl/fi/ixfw289m0sibcyfyrxf9g/SMARTEDTV.apk?rlkey=z59708sngkysw0c1ntmmur6lv&st=okcfec6i&dl=1"
          curl -L --max-time 300 -o .cache/base/base.apk "$DROPBOX_URL"
          echo "Downloaded: $(stat -c%s .cache/base/base.apk) bytes"
          echo "SHA256: $(sha256sum .cache/base/base.apk | awk '{print $1}')"

      - name: Verify source has ClickAdilla
        run: |
          grep -q "vast.yomeno.xyz/vast?spot_id=1508180" smartedtv/js/config.js
          grep -q "spot_id=1508180" kodi-addon/script.smartedtv.welcome/vast.py
          echo "Source files verified: ClickAdilla VAST #1508180"

      - name: Decode APK with apktool
        run: |
          java -Xmx2g -jar $APKTOOL d -f -s .cache/base/base.apk -o .cache/work/decoded

      - name: Replace addon files in decoded APK
        run: python3 -c "
          import shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from apk_pipeline import ROOT, ADDONS

          decoded = Path('.cache/work/decoded')
          assets = decoded / 'assets'
          ignore = shutil.ignore_patterns('__pycache__', '*.pyc', '.DS_Store')

          # Copy addons
          for addon in ADDONS:
              source = ROOT / ('skin' if addon.startswith('skin.') else 'kodi-addon') / addon
              target = assets / 'addons' / addon
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(source, target, ignore=ignore)
              print(f'Copied addon: {addon}')

          # Copy web interface
          web = assets / 'smartedtv'
          if web.exists():
              shutil.rmtree(web)
          shutil.copytree(ROOT / 'smartedtv', web, ignore=ignore)
          print('Copied web interface: smartedtv/')

          # Update addon manifest
          import xml.etree.ElementTree as ET
          addon_manifest = assets / 'system/addon-manifest.xml'
          tree = ET.parse(addon_manifest)
          for addon in ADDONS:
              existing = next((el for el in tree.getroot() if (el.text or '').strip() == addon), None)
              if existing is None:
                  existing = ET.SubElement(tree.getroot(), 'addon')
                  existing.text = addon
              existing.attrib.pop('optional', None)
          tree.write(addon_manifest, encoding='utf-8', xml_declaration=True)
          print('Updated addon manifest')
        "

      - name: Rebuild APK with apktool
        run: |
          java -Xmx2g -jar $APKTOOL b .cache/work/decoded -o .cache/work/unsigned.apk
          echo "Unsigned: $(stat -c%s .cache/work/unsigned.apk) bytes"

      - name: Zipalign and sign
        run: |
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/35.0.0
          $BUILD_TOOLS/zipalign -P 16 -f 4 .cache/work/unsigned.apk .cache/work/aligned.apk
          keytool -genkey -v -keystore .cache/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SMARTEDTV" -noprompt 2>&1 | tail -2
          $BUILD_TOOLS/apksigner sign --ks .cache/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias debug \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out dist/SMARTEDTV-universal.apk .cache/work/aligned.apk
          echo "Final: $(stat -c%s dist/SMARTEDTV-universal.apk) bytes"
          echo "SHA256: $(sha256sum dist/SMARTEDTV-universal.apk | awk '{print $1}')"

      - name: Verify APK
        run: |
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/35.0.0
          $BUILD_TOOLS/apksigner verify --verbose dist/SMARTEDTV-universal.apk 2>&1 | tail -5
          # Check that ClickAdilla URL is inside the APK
          unzip -p dist/SMARTEDTV-universal.apk assets/addons/script.smartedtv.welcome/vast.py | grep -q "spot_id=1508180" && echo "VAST Python OK"
          unzip -p dist/SMARTEDTV-universal.apk assets/smartedtv/js/config.js | grep -q "vast.yomeno.xyz" && echo "VAST JS OK"
          # Check no HilltopAds in text files
          HILLTOP=$(unzip -l dist/SMARTEDTV-universal.apk | awk '{print $4}' | grep -E '\.(py|js|html|xml|json)$' | while read f; do
            unzip -p dist/SMARTEDTV-universal.apk "$f" 2>/dev/null | grep -qi "hilltop" && echo "$f"
          done)
          if [ -n "$HILLTOP" ]; then
            echo "WARNING: HilltopAds still found in: $HILLTOP"
          else
            echo "No HilltopAds references in text files"
          fi

      - name: Upload to Release
        run: |
          gh release upload vast-fix-1508180 dist/SMARTEDTV-universal.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
