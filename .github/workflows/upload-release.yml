name: Upload APK to Release

on:
  workflow_dispatch:
  push:
    branches:
      - arena/180d028f-smarted

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download APK
        run: bash ${{ github.workspace }}/tools/download_apk.sh

      - name: Extract
        run: |
          mkdir -p extracted && cd extracted
          unzip -q -o ../SMARTEDTV-original.apk
          echo "Files: $(find . -type f | wc -l)"

      - name: Before - hilltop refs
        run: |
          cd extracted
          echo "=== BEFORE ==="
          grep -rli "hilltop" . 2>/dev/null | while read f; do
            echo "  $f"; grep -in "hilltop" "$f" 2>/dev/null | head -2
          done

      - name: Replace VAST URLs
        run: |
          cd extracted
          python3 ${{ github.workspace }}/tools/replace_vast.py .

      - name: After - hilltop refs
        run: |
          cd extracted
          echo "=== AFTER ==="
          grep -rli "hilltop" . 2>/dev/null | while read f; do
            echo "  $f"; grep -in "hilltop" "$f" 2>/dev/null | head -2
          done
          echo ""
          echo "=== ClickAdilla ==="
          grep -rli "vast.yomeno" --include="*.py" --include="*.js" --include="*.html" . 2>/dev/null

      - name: Repackage
        run: |
          cd extracted
          zip -r -q -n ".so:.dex" ../SMARTEDTV-new-unsigned.apk .
          cd ..
          echo "Unsigned: $(stat -c%s SMARTEDTV-new-unsigned.apk) bytes"

      - name: Sign
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SMARTEDTV" 2>&1 | tail -1
          if command -v zipalign &>/dev/null; then
            zipalign -f -p 4 SMARTEDTV-new-unsigned.apk SMARTEDTV-aligned.apk
          else
            cp SMARTEDTV-new-unsigned.apk SMARTEDTV-aligned.apk
          fi
          if command -v apksigner &>/dev/null; then
            apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias debug \
              --out SMARTEDTV-universal.apk SMARTEDTV-aligned.apk
          else
            jarsigner -keystore /tmp/debug.keystore -storepass android -keypass android \
              -signedjar SMARTEDTV-universal.apk SMARTEDTV-aligned.apk debug 2>&1 | tail -3
          fi
          echo "Final: $(stat -c%s SMARTEDTV-universal.apk) bytes"
          echo "SHA256: $(sha256sum SMARTEDTV-universal.apk | awk '{print $1}')"

      - name: Upload
        run: gh release upload vast-fix-1508180 SMARTEDTV-universal.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
