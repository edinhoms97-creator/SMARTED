name: Upload APK to Release

on:
  workflow_dispatch:
    inputs:
      dropbox_url:
        description: 'Dropbox temporary download URL'
        required: true
        default: ''
  push:
    paths:
      - '.github/workflows/upload-release.yml'
      - 'tools/replace_vast.py'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download original APK from Dropbox
        run: |
          DROPBOX_URL="${{ github.event.inputs.dropbox_url }}"
          if [ -z "$DROPBOX_URL" ]; then echo "No Dropbox URL"; exit 0; fi
          echo "Downloading APK..."
          curl -L --max-time 300 -o SMARTEDTV-original.apk "$DROPBOX_URL"
          echo "Size: $(stat -c%s SMARTEDTV-original.apk) bytes"
          echo "SHA256: $(sha256sum SMARTEDTV-original.apk | awk '{print $1}')"

      - name: Extract APK
        run: |
          mkdir -p extracted && cd extracted && unzip -q -o ../SMARTEDTV-original.apk
          echo "Extracted $(find . -type f | wc -l) files"

      - name: Generate hilltop report
        run: |
          cd extracted
          mkdir -p ../hilltop-report
          echo "# HilltopAds References Report" > ../hilltop-report/report.md
          echo "" >> ../hilltop-report/report.md
          echo "Before replacement:" >> ../hilltop-report/report.md
          echo "" >> ../hilltop-report/report.md
          BINARY_EXTS="so dex class png jpg jpeg gif webp mp4 mp3 ogg wav ttf otf woff woff2 arsc"
          for f in $(grep -rli "hilltop" . 2>/dev/null); do
            EXT="${f##*.}"; EXT_LOWER=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
            IS_BINARY=0
            for be in $BINARY_EXTS; do [ "$EXT_LOWER" = "$be" ] && IS_BINARY=1 && break; done
            FSIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            echo "## $f" >> ../hilltop-report/report.md
            echo "- Size: $FSIZE, Binary: $IS_BINARY" >> ../hilltop-report/report.md
            echo '```' >> ../hilltop-report/report.md
            if [ "$IS_BINARY" = "0" ] && [ "$FSIZE" -lt 10485760 ]; then
              grep -in "hilltop\|https\?://" "$f" 2>/dev/null | grep -i "hilltop" | head -5 >> ../hilltop-report/report.md
            else
              strings "$f" 2>/dev/null | grep -i "hilltop" | head -5 >> ../hilltop-report/report.md
            fi
            echo '```' >> ../hilltop-report/report.md
            echo "" >> ../hilltop-report/report.md
          done
          cat ../hilltop-report/report.md

      - name: Replace HilltopAds URLs using Python script
        run: |
          cd extracted
          python3 $GITHUB_WORKSPACE/tools/replace_vast.py .

      - name: Verify replacement
        run: |
          cd extracted
          BINARY_EXTS="so dex class png jpg jpeg gif webp mp4 mp3 ogg wav ttf otf woff woff2 arsc"
          REMAINING=0
          for f in $(grep -rli "hilltop" . 2>/dev/null); do
            EXT="${f##*.}"; EXT_LOWER=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
            IS_BINARY=0
            for be in $BINARY_EXTS; do [ "$EXT_LOWER" = "$be" ] && IS_BINARY=1 && break; done
            FSIZE=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$IS_BINARY" = "0" ] && [ "$FSIZE" -lt 10485760 ]; then
              echo "STILL IN TEXT: $f"
              grep -in "hilltop" "$f" | head -3
              REMAINING=$((REMAINING+1))
            else
              echo "Binary file (ignored): $f"
            fi
          done
          echo ""
          echo "=== ClickAdilla URLs present ==="
          grep -rli "vast.yomeno.xyz" --include="*.py" --include="*.js" --include="*.html" --include="*.xml" . 2>/dev/null | head -10
          if [ "$REMAINING" -gt 0 ]; then
            echo "FAILED: $REMAINING text files still contain hilltop"
            exit 1
          fi
          echo "All text files verified clean."

      - name: Repackage APK
        run: |
          cd extracted
          zip -r -q -n ".so:.dex" ../SMARTEDTV-new-unsigned.apk .
          cd ..
          echo "Unsigned: $(stat -c%s SMARTEDTV-new-unsigned.apk) bytes"

      - name: Zipalign and sign
        run: |
          keytool -genkey -v -keystore /tmp/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SMARTEDTV, OU=SMARTEDTV, O=SMARTEDTV, L=SP, S=SP, C=BR" 2>&1 | tail -1
          if command -v zipalign &>/dev/null; then
            zipalign -f -p 4 SMARTEDTV-new-unsigned.apk SMARTEDTV-aligned.apk
          else
            cp SMARTEDTV-new-unsigned.apk SMARTEDTV-aligned.apk
          fi
          if command -v apksigner &>/dev/null; then
            apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android \
              --key-pass pass:android --ks-key-alias debug \
              --out SMARTEDTV-universal.apk SMARTEDTV-aligned.apk
          else
            jarsigner -keystore /tmp/debug.keystore -storepass android -keypass android \
              -signedjar SMARTEDTV-universal.apk SMARTEDTV-aligned.apk debug 2>&1 | tail -3
          fi
          echo "Final: $(stat -c%s SMARTEDTV-universal.apk) bytes"
          echo "SHA256: $(sha256sum SMARTEDTV-universal.apk | awk '{print $1}')"

      - name: Upload to Release
        run: |
          gh release upload vast-fix-1508180 SMARTEDTV-universal.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
