name: Upload APK to Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'release-parts/**'
      - '.github/workflows/upload-release.yml'

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble APK
        run: |
          cat release-parts/SMARTEDTV-universal.apk.part.* > SMARTEDTV-universal.apk
          SIZE=$(stat -c%s SMARTEDTV-universal.apk)
          echo "Size: $SIZE"
          if [ "$SIZE" != "259710320" ]; then
            echo "Size mismatch! Expected 259710320, got $SIZE"
            exit 1
          fi

      - name: Verify SHA256
        run: |
          SHA=$(sha256sum SMARTEDTV-universal.apk | awk '{print $1}')
          echo "Got: $SHA"
          echo "Expected: 4a497269ac7f1a9475e299fd39af3b8d688a3f5b145cc256b08d1b25f6efddb4"
          if [ "$SHA" != "4a497269ac7f1a9475e299fd39af3b8d688a3f5b145cc256b08d1b25f6efddb4" ]; then
            echo "SHA256 MISMATCH!"
            exit 1
          fi
          echo "SHA256 OK"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Token present: ${GH_TOKEN:+yes}"
          gh release upload vast-fix-1508180 SMARTEDTV-universal.apk --clobber
