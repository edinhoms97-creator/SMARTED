name: SMARTED original — auditoria sem alterar skin
run-name: SMARTED original · auditoria · ${{ github.ref_name }}

# Read-only until the original ad hook has been identified. No APK publication.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Desativado: usar somente o APK original fixado'
        type: string
        default: ''
      base_sha256:
        description: 'Desativado: identidade original pelo content hash Dropbox'
        type: string
        default: ''
      publish_release:
        description: 'Publicacao bloqueada durante correcao; nenhum APK sera publicado'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: smartedtv-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  INPUT_BASE_URL: ${{ inputs.base_url }}
  INPUT_BASE_SHA256: ${{ inputs.base_sha256 }}

jobs:
  audit:
    name: Inspecionar exatamente o original (sem modificar APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Testes rapidos do motor de anuncios
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/smartedtv-base
          key: smartedtv-base-dropbox-03c2b45efbe3256e6c11f8cc9809babe133a90b180eb007cf5908f597643e277
      - name: Baixar e conferir identidade do original, sem substituicoes
        run: |
          test -z "$INPUT_BASE_URL" && test -z "$INPUT_BASE_SHA256" || { echo '::error::Outra base esta proibida nesta correcao'; exit 1; }
          mkdir -p dist
          python3 tools/apk_pipeline.py download .cache/smartedtv-base/base.apk --report dist/original-identity.json
      - name: Identificar pacote e pontos de anuncios existentes (somente leitura)
        run: |
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs .cache/smartedtv-base/base.apk > dist/original-signature.txt
          "$tools/aapt2" dump badging .cache/smartedtv-base/base.apk > dist/original-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('dist/original-badging.txt').read_text().splitlines()
          for line in lines:
              if line.startswith(('package:', 'application-label:', 'launchable-activity:', 'native-code:', 'sdkVersion:', 'targetSdkVersion:')):
                  safe = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::notice title=SMARTED original identity::' + safe)
          PY
          python3 tools/audit_original_apk.py .cache/smartedtv-base/base.apk dist/original-inventory.json
      - name: Contrato original de transporte VAST (somente leitura)
        run: python3 tools/inspect_ad_contract.py .cache/smartedtv-base/base.apk transport
      - name: Contrato original de retomada (somente leitura)
        run: python3 tools/inspect_ad_contract.py .cache/smartedtv-base/base.apk resume
      - name: Contrato original de roteamento (somente leitura)
        run: python3 tools/inspect_ad_contract.py .cache/smartedtv-base/base.apk routing
      - name: Fluxo original de no-fill (somente leitura)
        run: python3 tools/inspect_ad_contract.py .cache/smartedtv-base/base.apk fetchflow
      - name: Tracking original (somente leitura)
        run: python3 tools/inspect_ad_contract.py .cache/smartedtv-base/base.apk playback
      - name: Relatorio apenas (nenhum APK)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SMARTED-original-audit
          path: dist/
          if-no-files-found: error
          retention-days: 7
