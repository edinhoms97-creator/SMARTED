name: SMARTED original — somente anuncios, skin intacta
run-name: SMARTED original · anuncios apenas · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      vast_function_lab:
        description: 'Laboratorio isolado, baseline ou release de uma unica funcao VAST'
        type: string
        default: ''
      publish_existing_run:
        description: 'Anexar artefato ja auditado a prerelease existente; nao recompila'
        type: string
        default: ''
      read_publish_log:
        description: 'Diagnostico somente leitura de falha de publicacao existente'
        type: string
        default: ''
      vast_comparison:
        description: 'Somente relatorio dos scripts em APKs ja publicados; nao gera APK nem consulta anuncios'
        type: boolean
        default: false
      android_probe:
        description: 'Preparar emulador real e testar compatibilidade de instalacao, sem gerar APK'
        type: boolean
        default: false
      android_log_run:
        description: 'Ler somente logs de um run Android anterior, sem SDK ou novas requisicoes de anuncios'
        type: string
        default: ''
      android_cycles:
        description: 'Tentar 3 aberturas Android reais com amostras publicas, sem simular anuncios/pixels'
        type: boolean
        default: false
      android_release:
        description: 'Prerelease exata para validar no Android'
        type: string
        default: smarted-original-ads-46035861727-1
      stabilize_openings:
        description: '9436b5e + tracking preservado + estabilizacao restrita de aberturas/transicao'
        type: boolean
        default: false
      confirmed_reference:
        description: 'Restaurar base confirmada 9436b5e e alterar SOMENTE tracking; tem prioridade sobre outros perfis'
        type: boolean
        default: true
      vast_source:
        description: 'Fonte VAST do perfil minimo; original restaura URL e spot exatos do APK'
        type: choice
        options:
          - original
          - clickadilla
        default: original
      delivery_probe:
        description: 'Inspecao: duas tentativas sem pixels, fonte original e Clickadilla; decode CPU se houver criativo'
        type: boolean
        default: false
      minimal_clickadilla:
        description: 'Original Dropbox: fonte VAST selecionada + tracking, sem os patches anteriores de player'
        type: boolean
        default: true
      inspect_only:
        description: 'Somente inspecao de contratos originais, sem gerar/publicar APK'
        type: boolean
        default: false
      base_url:
        description: 'Desativado: somente o APK original fixado e permitido'
        type: string
        default: ''
      base_sha256:
        description: 'Desativado: a identidade original e validada pelo hash Dropbox'
        type: string
        default: ''
      publish_release:
        description: 'Publicar APK de teste somente apos conferir preservacao integral da skin'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: smartedtv-apk-${{ github.ref }}-${{ inputs.android_probe }}
  cancel-in-progress: false

env:
  STABILIZE_OPENINGS: ${{ inputs.stabilize_openings }}
  CONFIRMED_REFERENCE: ${{ inputs.confirmed_reference }}
  VAST_SOURCE: ${{ inputs.vast_source }}
  MINIMAL_CLICKADILLA: ${{ inputs.minimal_clickadilla }}
  ANDROID_HOME: /usr/local/lib/android/sdk
  INPUT_BASE_URL: ${{ inputs.base_url }}
  INPUT_BASE_SHA256: ${{ inputs.base_sha256 }}

jobs:
  build:
    if: ${{ inputs.vast_function_lab == '' && inputs.publish_existing_run == '' && inputs.read_publish_log == '' && !inputs.vast_comparison && !inputs.android_probe && inputs.android_log_run == '' }}
    name: Original SMARTED — patch restrito de anuncios
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Testes rapidos e gates de preservacao
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/smartedtv-base
          key: smartedtv-base-dropbox-03c2b45efbe3256e6c11f8cc9809babe133a90b180eb007cf5908f597643e277
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/smartedtv-signing
          key: smartedtv-test-debug-key-v1
      - name: Inspecao somente leitura dos botoes e helpers
        if: inputs.inspect_only && !inputs.delivery_probe
        run: |
          python3 tools/apk_pipeline.py download .cache/smartedtv-base/base.apk --report .cache/base-identity.json
          python3 tools/inspect_resume_contract.py .cache/smartedtv-base/base.apk
      - name: Comparar entrega original e Clickadilla sem pixels (duas tentativas)
        if: inputs.inspect_only && inputs.delivery_probe
        run: |
          python3 tools/apk_pipeline.py download .cache/smartedtv-base/base.apk --report .cache/base-identity.json
          python3 -m pip install --disable-pip-version-check --no-deps imageio-ffmpeg==0.6.0
          python3 tools/probe_ad_delivery.py .cache/smartedtv-base/base.apk --report .cache/delivery-probe.json
      - name: Empacotar somente anuncios; verificar todos os outros arquivos
        if: ${{ !inputs.inspect_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -o pipefail
          trap 'python3 tools/report_build_diagnostics.py .cache/apk-build.log' ERR
          bash tools/build-universal-apk.sh 2>&1 | tee .cache/apk-build.log
      - name: APK de teste e relatorio de preservacao
        if: ${{ !inputs.inspect_only }}
        id: artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SMARTED-original-ads-only
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Diagnostico sem APK se falhar
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SMARTED-original-diagnostics
          path: |
            dist/*.json
            dist/*.txt
          if-no-files-found: ignore
      - name: Resumo sem alegar teste em aparelho
        if: ${{ !inputs.inspect_only }}
        run: |
          {
            echo '## SMARTED original — anuncios apenas'
            echo 'Skin, bootstrap e manifesto binario preservados. Sem novo servico ou welcome.'
            echo 'Teste de inicializacao/reproducao em aparelho ainda pendente.'
            cat dist/preservation.json
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Disponibilizar build corretivo de teste
    needs: build
    if: inputs.publish_release && !inputs.inspect_only
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SMARTED-original-ads-only
          path: dist
      - name: Publicar somente o artefato conferido
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SMARTEDTV-universal.apk.sha256)
          tag="smarted-original-ads-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="SMARTED original — VAST ${VAST_SOURCE} e diagnostico de entrega (teste)"
          extra=()
          if [[ "${CONFIRMED_REFERENCE}" == "true" ]]; then
            title="SMARTED — base confirmada 9436b5e, somente tracking (teste)"
            extra+=(dist/reference-preservation.json)
          fi
          if [[ "${STABILIZE_OPENINGS}" == "true" ]]; then
            title="SMARTED — 9436b5e, ciclo por abertura e transicao nativa (teste)"
          fi
          if gh release view "$tag" --json targetCommitish > /tmp/smarted-release.json 2>/dev/null; then
            test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
            test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = true
            gh release upload "$tag" --clobber dist/SMARTEDTV-universal.apk dist/SMARTEDTV-universal.apk.sha256 dist/preservation.json dist/source-preservation.json dist/signature.txt dist/badging.txt "${extra[@]}"
            gh release edit "$tag" --notes-file dist/INSTALLATION.txt
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease \
              --title "$title" \
              --notes-file dist/INSTALLATION.txt \
              dist/SMARTEDTV-universal.apk dist/SMARTEDTV-universal.apk.sha256 \
              dist/preservation.json dist/source-preservation.json dist/signature.txt dist/badging.txt "${extra[@]}"
          fi
          gh release view "$tag" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

  android:
    if: inputs.android_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar permissao KVM e obter o APK exato
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.android_release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^smarted-original-ads-[0-9]+-[0-9]+$ ]]
          if [[ -e /dev/kvm ]]; then sudo chmod a+rw /dev/kvm; fi
          mkdir -p .cache/android-validation
          gh release download "$RELEASE_TAG" --pattern SMARTEDTV-universal.apk --dir .cache/android-validation
      - name: Testar payload estabilizado exato antes dos ciclos Android
        if: inputs.android_cycles
        run: |
          python3 - <<'PYMODULES'
          from pathlib import Path
          import zipfile
          folder = Path('.cache/android-native-modules')
          folder.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('.cache/android-validation/SMARTEDTV-universal.apk') as archive:
              for name in archive.namelist():
                  if name.startswith('assets/addons/service.smarted.bootstrap/') and name.endswith('.py'):
                      (folder / Path(name).name).write_bytes(archive.read(name))
          PYMODULES
          python3 tools/test_stabilized_openings.py --original .cache/android-native-modules
      - name: Biblioteca para preview pequeno da evidencia visual
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Tentar criar AVD, boot e instalar APK sem mudar ABI
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_CONTENT_CYCLES: ${{ inputs.android_cycles }}
        run: |
          python3 tools/android_validation_environment.py --prepare \
            --apk .cache/android-validation/SMARTEDTV-universal.apk \
            --report .cache/android-validation/result.json
      - name: Guardar resultado real, inclusive limitacoes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-environment-result
          path: |
            .cache/android-validation/*.json
            .cache/android-validation/*.xml
            .cache/android-validation/*.txt
            .cache/android-validation/*.png
            .cache/android-validation/*.jpg
            .cache/android-validation/*.log
            .cache/android-emulator.log
          if-no-files-found: warn
          retention-days: 7

  android_logs:
    if: inputs.android_log_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ler artefato existente sem abrir conteudo nem pedir anuncios
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.android_log_run }}
          RELEASE_TAG: ${{ inputs.android_release }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --name android-environment-result --dir .cache/android-log-read
          [[ "$RELEASE_TAG" =~ ^smarted-original-ads-[0-9]+-[0-9]+$ ]]
          gh release download "$RELEASE_TAG" --pattern SMARTEDTV-universal.apk --dir .cache/android-log-read
          python3 tools/read_android_monitor_logs.py .cache/android-log-read .cache/android-log-read/SMARTEDTV-universal.apk

  vast_comparison:
    if: inputs.vast_comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Comparar APKs existentes sem abrir player ou consultar VAST
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/report_vast_apk_diff.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vast-apk-script-comparison
          path: |
            .cache/vast-apk-comparison/comparison.json
            .cache/vast-apk-comparison/scripts.diff
          retention-days: 30

  publish_diagnostic:
    if: inputs.read_publish_log != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Ler erro existente sem reconstruir nem publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.read_publish_log }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$RUN_ID" --log-failed > .cache-publish-error.txt
          python3 - <<'PYLOG'
          import base64, gzip, json
          from pathlib import Path
          data = base64.b64encode(gzip.compress(Path('.cache-publish-error.txt').read_bytes()[-18000:])).decode()
          for i in range(0, len(data), 3500):
              print('::notice title=Publish diagnostic chunks::'+json.dumps({'part':i//3500,'data':data[i:i+3500]}))
          PYLOG

  recover_publication:
    if: inputs.publish_existing_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - name: Anexar somente APK auditado a prerelease ja criada
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.publish_existing_run }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          tag="smarted-original-ads-${RUN_ID}-1"
          source=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq .head_sha)
          target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
          test "$source" = "$target"
          test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = true
          gh run download "$RUN_ID" --name SMARTED-original-ads-only --dir dist
          (cd dist && sha256sum -c SMARTEDTV-universal.apk.sha256)
          grep -F "$source" dist/INSTALLATION.txt
          gh release upload "$tag" --clobber dist/SMARTEDTV-universal.apk dist/SMARTEDTV-universal.apk.sha256 dist/preservation.json dist/source-preservation.json dist/reference-preservation.json dist/signature.txt dist/badging.txt
          gh release edit "$tag" --notes-file dist/INSTALLATION.txt

  vast_function_lab:
    if: inputs.vast_function_lab != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: inputs.vast_function_lab == 'release'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: inputs.vast_function_lab == 'release'
        with:
          path: .cache/smartedtv-signing
          key: smartedtv-test-debug-key-v1
      - name: Preparar laboratorio isolado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test '${{ inputs.vast_function_lab }}' = baseline || test '${{ inputs.vast_function_lab }}' = release || test '${{ inputs.vast_function_lab }}' = selector-baseline
          mkdir -p .cache/vast-lab/base
          gh release download smarted-original-ads-46074593488-1 --pattern SMARTEDTV-universal.apk --dir .cache/vast-lab/base
          echo '2b64c443f42902cb07031db1106137a59d852ae39bb8fbd8b9379b8a6d2682bc  .cache/vast-lab/base/SMARTEDTV-universal.apk' | sha256sum -c -
          python3 -m pip install --disable-pip-version-check playwright==1.58.0 imageio-ffmpeg==0.6.0 pillow==12.1.0
          command -v google-chrome
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
          python3 tools/test_vast_single_function.py --apk .cache/vast-lab/base/SMARTEDTV-universal.apk -v
      - name: Evidencia ANTES de alterar funcao (baseline real ja registrado em 46078100066)
        run: |
          mkdir -p .cache/vast-lab/baseline
          set -o pipefail
          extra=()
          if [[ '${{ inputs.vast_function_lab }}' == baseline ]]; then extra+=(--live); fi
          python3 tools/vast_visual_lab.py --apk .cache/vast-lab/base/SMARTEDTV-universal.apk --out .cache/vast-lab/baseline/evidence --selection "${extra[@]}" 2>&1 | tee .cache/vast-lab/lab.log
      - name: Leitura exata dos helpers de selecao, sem alteracao
        run: |
          python3 - <<'PYSELECT'
          import ast,base64,gzip,json,zipfile
          with zipfile.ZipFile('.cache/vast-lab/base/SMARTEDTV-universal.apk') as z:
              s=z.read('assets/addons/service.smarted.bootstrap/ads_vast.py').decode()
          names={'_media_escolhido','tag_do_wrapper','tag_do_vmap','sem_namespace','escolher_anuncio','_urls_de_evento','_urls_de_impressao','_duracao','_segundos','_inteiro','_texto'}
          functions={n.name:ast.get_source_segment(s,n) for n in ast.parse(s).body if isinstance(n,ast.FunctionDef) and n.name in names}
          data=base64.b64encode(gzip.compress(json.dumps(functions).encode())).decode()
          for i in range(0,len(data),3500):
              print('::notice title=VAST exact selection helpers::'+json.dumps({'part':i//3500,'total':(len(data)+3499)//3500,'data':data[i:i+3500]}))
          summary=json.load(open('.cache/vast-lab/baseline/evidence/summary.json'))
          for a in summary['attempts'][9:]:
              print(a['label'],a.get('selection_matches_expectation'),a.get('media'),a['receipt'])
          PYSELECT
      - name: Alterar SOMENTE exibir e assinar com certificado conferido
        if: inputs.vast_function_lab == 'release'
        run: |
          set -o pipefail
          bash tools/build_vast_single_function.sh 2>&1 | tee .cache/vast-lab/build.log
      - name: Evidencia DEPOIS, tres chamadas reais e fixtures sem pixels
        if: inputs.vast_function_lab == 'release'
        run: |
          set -o pipefail
          python3 tools/vast_visual_lab.py --apk .cache/vast-lab/release/SMARTEDTV-universal.apk --out .cache/vast-lab/after/evidence --live 2>&1 | tee .cache/vast-lab/after.log
      - name: Preview real limitado e resumo de verificacao
        run: |
          python3 - <<'PYPREVIEW'
          import base64,json,io
          from pathlib import Path
          from PIL import Image
          root=Path('.cache/vast-lab')
          evidence=root/('after' if (root/'after').exists() else 'baseline')/'evidence'
          for attempt in ('001','004'):
              image=Image.open(evidence/attempt/'04-playback-result.jpg')
              image.thumbnail((660,492));b=io.BytesIO();image.save(b,format='JPEG',quality=25,optimize=True)
              data=base64.b64encode(b.getvalue()).decode()
              for i in range(0,len(data),3500):
                  print('::notice title=VAST lab screenshot chunks::'+json.dumps({'attempt':attempt,'part':i//3500,'total':(len(data)+3499)//3500,'data':data[i:i+3500]}))
          r=json.loads((evidence/'summary.json').read_text())
          for a in r['attempts']:
              print('::notice title=VAST final attempt::'+json.dumps({k:a.get(k) for k in ('id','mode','requests','classification','browser_playback','receipt')}))
          PYPREVIEW
      - name: Diagnostico do laboratorio se falhar
        if: failure()
        run: |
          python3 tools/report_build_diagnostics.py .cache/vast-lab/lab.log
          python3 tools/report_build_diagnostics.py .cache/vast-lab/build.log
          python3 tools/report_build_diagnostics.py .cache/vast-lab/after.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vast-visual-lab-evidence
          path: |
            .cache/vast-lab/baseline/evidence/
            .cache/vast-lab/after/evidence/
            .cache/vast-lab/*.log
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.vast_function_lab == 'release'
        with:
          name: SMARTED-vast-single-function
          path: .cache/vast-lab/release/
          compression-level: 0
          retention-days: 30
      - name: Publicar somente prerelease previamente autorizada com fonte exata
        if: inputs.vast_function_lab == 'release' && inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="smarted-vast-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test "$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          test "$(gh release view "$tag" --json isPrerelease --jq .isPrerelease)" = true
          cd .cache/vast-lab/release
          sha256sum -c SMARTEDTV-universal.apk.sha256
          gh release upload "$tag" SMARTEDTV-universal.apk SMARTEDTV-universal.apk.sha256 source-preservation.json preservation.json signature.txt badging.txt INSTALLATION.txt
          gh release edit "$tag" --notes-file INSTALLATION.txt
          gh release view "$tag" --json url --jq .url
