name: Build APK - VAST Fix Only (Preserve Original Skin/UI)

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  BUILD_TOOLS_VERSION: '35.0.0'
  APKTOOL_VERSION: '2.12.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools and apktool
        run: |
          set -e
          if [[ ! -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS_VERSION"
          fi
          mkdir -p .cache
          jar=".cache/apktool.jar"
          if [[ ! -f "$jar" ]]; then
            curl --fail --location -o "$jar" "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          fi
          echo "APKTOOL=$PWD/$jar" >> $GITHUB_ENV
          echo "TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_ENV

      - name: Download ORIGINAL APK from Dropbox
        run: |
          mkdir -p .cache/base dist
          curl -L --max-time 300 -o .cache/base/base.apk "https://www.dropbox.com/scl/fi/ixfw289m0sibcyfyrxf9g/SMARTEDTV.apk?rlkey=z59708sngkysw0c1ntmmur6lv&st=okcfec6i&dl=1"
          SIZE=$(stat -c%s .cache/base/base.apk)
          echo "Original APK: $SIZE bytes"
          test "$SIZE" = "263222483"

      - name: Decode APK
        run: java -Xmx2g -jar $APKTOOL d -f -s .cache/base/base.apk -o .cache/work/decoded

      - name: Find HilltopAds URLs in original APK
        run: |
          echo "=== HilltopAds references found in ORIGINAL APK ==="
          cd .cache/work/decoded
          find . -type f \( -name "*.py" -o -name "*.js" -o -name "*.html" -o -name "*.xml" -o -name "*.json" -o -name "*.txt" \) -exec grep -l -i "hilltop" {} \; 2>/dev/null | while read f; do
            echo "FILE: $f"
            grep -in "hilltop" "$f" 2>/dev/null | head -5
            echo ""
          done

      - name: Replace ONLY HilltopAds URLs with ClickAdilla
        run: |
          cd .cache/work/decoded
          CLICKADILLA="https://vast.yomeno.xyz/vast?spot_id=1508180"
          python3 << 'PYREPLACE'
          import os, re
          CLICKADILLA = "https://vast.yomeno.xyz/vast?spot_id=1508180"
          exts = {".py", ".js", ".html", ".xml", ".json", ".txt", ".cfg", ".ini"}
          replaced = 0
          for root, dirs, files in os.walk("."):
              for fname in files:
                  fpath = os.path.join(root, fname)
                  ext = os.path.splitext(fname)[1].lower()
                  if ext not in exts:
                      continue
                  try:
                      size = os.path.getsize(fpath)
                      if size > 10*1024*1024:
                          continue
                      with open(fpath, "rb") as f:
                          data = f.read()
                      if b"hilltop" not in data.lower():
                          continue
                      for enc in ("utf-8", "latin-1"):
                          try:
                              text = data.decode(enc)
                              used_enc = enc
                              break
                          except:
                              continue
                      else:
                          continue
                      original = text
                      # Replace any URL containing hilltop
                      text = re.sub(r'https?://[^"' <>\]\}]*hilltop[^"' <>\]\}]*', CLICKADILLA, text, flags=re.IGNORECASE)
                      # Replace any domain with hilltopads
                      text = re.sub(r'[A-Za-z0-9._-]*hilltopads\.[A-Za-z0-9._/-]+[^"' <>\]\}]*', CLICKADILLA, text, flags=re.IGNORECASE)
                      if text != original:
                          with open(fpath, "w", encoding=used_enc, errors="replace") as f:
                              f.write(text)
                          print(f"Replaced in: {fpath}")
                          replaced += 1
                  except Exception as e:
                      pass
          print(f"Total files modified: {replaced}")
          PYREPLACE

      - name: Verify - no HilltopAds, ClickAdilla present, skin/UI intact
        run: |
          cd .cache/work/decoded
          echo "=== After replacement check ==="
          echo "Text files still containing 'hilltop':"
          HILLTOP_COUNT=0
          find . -type f \( -name "*.py" -o -name "*.js" -o -name "*.html" -o -name "*.xml" -o -name "*.json" -o -name "*.txt" \) -exec grep -l -i "hilltop" {} \; 2>/dev/null | while read f; do
            echo "  FOUND: $f"
            grep -in "hilltop" "$f" | head -3
          done
          echo ""
          echo "Files now containing ClickAdilla:"
          grep -rli "vast.yomeno.xyz" --include="*.py" --include="*.js" --include="*.html" . 2>/dev/null | head -10
          echo ""
          echo "=== Skin/UI integrity check ==="
          echo "Skin files: $(find assets/addons/skin.estilo.personalizado -type f 2>/dev/null | wc -l)"
          echo "Web interface files: $(find assets/smartedtv -type f 2>/dev/null | wc -l)"
          echo "Service addon files: $(find assets/addons/service.smartedtv.startup -type f 2>/dev/null | wc -l)"
          echo "Welcome addon files: $(find assets/addons/script.smartedtv.welcome -type f 2>/dev/null | wc -l)"

      - name: Rebuild APK
        run: java -Xmx2g -jar $APKTOOL b .cache/work/decoded -o .cache/work/unsigned.apk

      - name: Zipalign and sign
        run: |
          $TOOLS/zipalign -P 16 -f 4 .cache/work/unsigned.apk .cache/work/aligned.apk
          keytool -genkey -v -keystore .cache/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SMARTEDTV" -noprompt 2>&1 | tail -1
          $TOOLS/apksigner sign --ks .cache/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias debug \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out dist/SMARTEDTV-universal.apk .cache/work/aligned.apk
          echo "Final: $(stat -c%s dist/SMARTEDTV-universal.apk) bytes"
          echo "SHA256: $(sha256sum dist/SMARTEDTV-universal.apk | awk '{print $1}')"

      - name: Verify APK
        run: |
          $TOOLS/apksigner verify --verbose dist/SMARTEDTV-universal.apk 2>&1 | tail -5
          echo ""
          echo "=== VAST URL check ==="
          unzip -p dist/SMARTEDTV-universal.apk assets/addons/script.smartedtv.welcome/vast.py 2>/dev/null | grep -i "VAST_TAG" | head -3
          unzip -p dist/SMARTEDTV-universal.apk assets/smartedtv/js/config.js 2>/dev/null | grep -i "vastTagUrl" | head -3
          echo ""
          echo "=== Final HilltopAds check ==="
          mkdir -p /tmp/apk_check && cd /tmp/apk_check
          unzip -q -o $GITHUB_WORKSPACE/dist/SMARTEDTV-universal.apk
          HILLTOP_FILES=$(grep -rli "hilltop" --include="*.py" --include="*.js" --include="*.html" --include="*.xml" --include="*.json" --include="*.txt" . 2>/dev/null)
          if [ -z "$HILLTOP_FILES" ]; then
            echo "SUCCESS: No HilltopAds references in APK text files"
          else
            echo "FAILED: HilltopAds still found in:"
            echo "$HILLTOP_FILES"
            exit 1
          fi

      - name: Upload to Release
        run: gh release upload vast-fix-1508180 dist/SMARTEDTV-universal.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
