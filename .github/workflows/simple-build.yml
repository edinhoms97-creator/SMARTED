name: Simple APK Build

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/180d028f-smarted

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install tools
        run: |
          yes | sdkmanager "build-tools;35.0.0" 2>&1 | tail -3
          mkdir -p .cache
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar" -o .cache/apktool.jar

      - name: Download base APK
        run: |
          mkdir -p .cache/base dist
          curl -L --max-time 300 -o .cache/base/base.apk "https://www.dropbox.com/scl/fi/ixfw289m0sibcyfyrxf9g/SMARTEDTV.apk?rlkey=z59708sngkysw0c1ntmmur6lv&st=okcfec6i&dl=1"
          SIZE=$(stat -c%s .cache/base/base.apk)
          echo "Downloaded: $SIZE bytes"
          test "$SIZE" = "263222483"

      - name: Decode APK
        run: java -Xmx2g -jar .cache/apktool.jar d -f -s .cache/base/base.apk -o .cache/work/decoded

      - name: Replace addon files
        run: python3 tools/replace_addons.py .cache/work/decoded

      - name: Rebuild APK
        run: java -Xmx2g -jar .cache/apktool.jar b .cache/work/decoded -o .cache/work/unsigned.apk

      - name: Zipalign and sign
        run: |
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/35.0.0
          $BUILD_TOOLS/zipalign -P 16 -f 4 .cache/work/unsigned.apk .cache/work/aligned.apk
          keytool -genkey -v -keystore .cache/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SMARTEDTV" -noprompt 2>&1 | tail -1
          $BUILD_TOOLS/apksigner sign --ks .cache/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias debug \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out dist/SMARTEDTV-universal.apk .cache/work/aligned.apk
          echo "Final: $(stat -c%s dist/SMARTEDTV-universal.apk) bytes"
          echo "SHA256: $(sha256sum dist/SMARTEDTV-universal.apk | awk '{print $1}')"

      - name: Verify APK
        run: |
          BUILD_TOOLS=$ANDROID_SDK_ROOT/build-tools/35.0.0
          $BUILD_TOOLS/apksigner verify --verbose dist/SMARTEDTV-universal.apk 2>&1 | tail -3
          unzip -p dist/SMARTEDTV-universal.apk assets/addons/script.smartedtv.welcome/vast.py | grep VAST_TAG
          unzip -p dist/SMARTEDTV-universal.apk assets/smartedtv/js/config.js | grep vastTagUrl

      - name: Upload to Release
        run: gh release upload vast-fix-1508180 dist/SMARTEDTV-universal.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
