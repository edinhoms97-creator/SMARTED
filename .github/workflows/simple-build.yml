name: Build APK - VAST Fix Only (Preserve Original Skin/UI)

on:
  workflow_dispatch: {}

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  BUILD_TOOLS_VERSION: '35.0.0'
  APKTOOL_VERSION: '2.12.1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools and apktool
        run: |
          set -e
          if [[ ! -x "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS_VERSION"
          fi
          mkdir -p .cache
          jar=".cache/apktool.jar"
          if [[ ! -f "$jar" ]]; then
            curl --fail --location -o "$jar" "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          fi
          echo "APKTOOL=$PWD/$jar" >> $GITHUB_ENV
          echo "TOOLS=$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION" >> $GITHUB_ENV

      - name: Download ORIGINAL APK from Dropbox
        run: |
          mkdir -p .cache/base dist
          curl -L --max-time 300 -o .cache/base/base.apk "https://www.dropbox.com/scl/fi/ixfw289m0sibcyfyrxf9g/SMARTEDTV.apk?rlkey=z59708sngkysw0c1ntmmur6lv&st=okcfec6i&dl=1"
          SIZE=$(stat -c%s .cache/base/base.apk)
          echo "Original APK: $SIZE bytes"
          test "$SIZE" = "263222483"

      - name: Decode APK
        run: java -Xmx2g -jar $APKTOOL d -f -s .cache/base/base.apk -o .cache/work/decoded

      - name: Find HilltopAds URLs in original APK
        run: |
          cd .cache/work/decoded
          echo "=== HilltopAds references in ORIGINAL APK ==="
          grep -rli "hilltop" --include="*.py" --include="*.js" --include="*.html" --include="*.xml" --include="*.json" --include="*.txt" --include="*.py" --include="*.js" --include="*.html" --include="*.xml" --include="*.json" . 2>/dev/null | while read f; do
            echo "  $f:"
            grep -in "hilltop" "$f" | head -3
          done

      - name: Replace ONLY HilltopAds URLs with ClickAdilla
        run: python3 ${{ github.workspace }}/tools/replace_vast_url.py .cache/work/decoded

      - name: Verify replacement and skin/UI integrity
        run: |
          cd .cache/work/decoded
          echo "=== After replacement ==="
          python3 ${{ github.workspace }}/tools/check_hilltop.py .
          echo ""
          echo "ClickAdilla found in:"
          grep -rli "vast.yomeno.xyz" --include="*.py" --include="*.js" . 2>/dev/null
          echo ""
          echo "Skin/UI file counts (preserved from original):"
          echo "  Skin: $(find assets/addons/skin.estilo.personalizado -type f 2>/dev/null | wc -l) files"
          echo "  Web UI: $(find assets/smartedtv -type f 2>/dev/null | wc -l) files"
          echo "  Service: $(find assets/addons/service.smartedtv.startup -type f 2>/dev/null | wc -l) files"

      - name: Rebuild APK
        run: java -Xmx2g -jar $APKTOOL b .cache/work/decoded -o .cache/work/unsigned.apk

      - name: Zipalign and sign
        run: |
          $TOOLS/zipalign -P 16 -f 4 .cache/work/unsigned.apk .cache/work/aligned.apk
          keytool -genkey -v -keystore .cache/debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=SMARTEDTV" -noprompt 2>&1 | tail -1
          $TOOLS/apksigner sign --ks .cache/debug.keystore --ks-pass pass:android \
            --key-pass pass:android --ks-key-alias debug \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out dist/SMARTEDTV-universal.apk .cache/work/aligned.apk
          echo "Final: $(stat -c%s dist/SMARTEDTV-universal.apk) bytes"
          echo "SHA256: $(sha256sum dist/SMARTEDTV-universal.apk | awk '{print $1}')"

      - name: Verify APK
        run: |
          $TOOLS/apksigner verify --verbose dist/SMARTEDTV-universal.apk 2>&1 | tail -3
          echo ""
          echo "=== Checking for ClickAdilla URL in APK ==="
          if unzip -p dist/SMARTEDTV-universal.apk assets/addons/script.smartedtv.welcome/vast.py 2>/dev/null | grep -q "spot_id=1508180"; then
            echo "  vast.py: OK - ClickAdilla found"
          else
            echo "  vast.py: WARNING - ClickAdilla not found at expected path, checking all files..."
            unzip -l dist/SMARTEDTV-universal.apk | grep vast.py
          fi
          if unzip -p dist/SMARTEDTV-universal.apk assets/smartedtv/js/config.js 2>/dev/null | grep -q "vast.yomeno"; then
            echo "  config.js: OK - ClickAdilla found"
          else
            echo "  config.js: WARNING - checking alternatives..."
            unzip -l dist/SMARTEDTV-universal.apk | grep config.js
          fi
          echo ""
          echo "=== Checking no HilltopAds in key files ==="
          for f in $(unzip -l dist/SMARTEDTV-universal.apk | grep -E "vast\.(py|js)$|config\.js$" | awk '{print $4}'); do
            if unzip -p dist/SMARTEDTV-universal.apk "$f" 2>/dev/null | grep -qi "hilltop"; then
              echo "  FAIL: $f still contains hilltop!"
              exit 1
            fi
          done
          echo "  All key files: OK - no HilltopAds"
          echo ""
          echo "SUCCESS: Original skin/UI/VIP/checkout/QR preserved"

      - name: Upload to Release
        run: gh release upload vast-fix-1508180 dist/SMARTEDTV-universal.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
