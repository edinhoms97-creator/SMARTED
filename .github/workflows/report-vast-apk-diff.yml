name: Relatorio somente leitura — scripts VAST dos APKs publicados
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Comparar APKs existentes sem abrir player ou consultar VAST
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/report_vast_apk_diff.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vast-apk-script-comparison
          path: |
            .cache/vast-apk-comparison/comparison.json
            .cache/vast-apk-comparison/scripts.diff
          retention-days: 30
