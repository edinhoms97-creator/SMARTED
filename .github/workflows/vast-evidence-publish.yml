name: VAST — preservar evidencias existentes sem reconstruir APK
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Recuperar APK e evidencias ja produzidas, sem recompilar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p .cache/vast-evidence/{initial,build,release}
          gh run download 46078100066 --name vast-visual-lab-evidence --dir .cache/vast-evidence/initial
          gh run download 46078577850 --name vast-visual-lab-evidence --dir .cache/vast-evidence/build
          gh release download smarted-vast-only-46078577850-1 --dir .cache/vast-evidence/release
          echo 'be858543111b725d741ff2ec2d1238a40ea3256c28e0c91ff87856db2d4e5bd7  .cache/vast-evidence/release/SMARTEDTV-universal.apk' | sha256sum -c -
          python3 -m pip install --disable-pip-version-check playwright==1.58.0 imageio-ffmpeg==0.6.0 pillow==12.1.0
      - name: Regressoes de modulos completos do MESMO APK (doubles, nao Android)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          dest=Path('.cache/vast-evidence/modules');dest.mkdir()
          with zipfile.ZipFile('.cache/vast-evidence/release/SMARTEDTV-universal.apk') as z:
              for name in z.namelist():
                  if name.startswith('assets/addons/service.smarted.bootstrap/') and name.endswith('.py'):
                      (dest/Path(name).name).write_bytes(z.read(name))
          PY
          set -o pipefail
          python3 tools/test_stabilized_openings.py --original .cache/vast-evidence/modules -v 2>&1 | tee .cache/vast-evidence/native-module-regressions.log
      - name: Somente fixtures com logs internos capturados, SEM novas chamadas reais
        run: |
          set -o pipefail
          python3 tools/vast_visual_lab.py --apk .cache/vast-evidence/release/SMARTEDTV-universal.apk --out .cache/vast-evidence/fixtures-with-native-logs 2>&1 | tee .cache/vast-evidence/fixtures.log
      - name: Captura real da fixture 004 para inspecao independente
        run: |
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          data=base64.b64encode(Path('.cache/vast-evidence/fixtures-with-native-logs/004/04-playback-result.jpg').read_bytes()).decode()
          # Existing full JPEG may exceed annotation limits: bounded preview, full PNG in archive.
          import io
          from PIL import Image
          b=io.BytesIO();im=Image.open('.cache/vast-evidence/fixtures-with-native-logs/004/04-playback-result.jpg')
          im.thumbnail((660,492));im.save(b,format='JPEG',quality=25,optimize=True)
          data=base64.b64encode(b.getvalue()).decode()
          for i in range(0,len(data),3500):
              print('::notice title=VAST fixture screenshot::'+json.dumps({'part':i//3500,'total':(len(data)+3499)//3500,'data':data[i:i+3500]}))
          PY
      - name: Arquivo duravel de evidencia, sem incluir o APK ou novos binarios
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh release view smarted-vast-only-46078577850-1 --json targetCommitish --jq .targetCommitish)" = 12a161928e32b195c60dd9dd88faf0c24838adf7
          cp docs/VAST_FUNCTION_1508249.md .cache/vast-evidence/README.md
          cp .cache/vast-evidence/release/{source-preservation.json,preservation.json,signature.txt,badging.txt,INSTALLATION.txt} .cache/vast-evidence/
          # exibir.diff is in the build artifact, not the release; fetch its small exact file only.
          gh run download 46078577850 --name SMARTED-vast-single-function --dir .cache/vast-evidence/build-audit
          cp .cache/vast-evidence/build-audit/exibir.diff .cache/vast-evidence/exibir.diff
          rm -r .cache/vast-evidence/{release,build-audit,modules}
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json
          root=Path('.cache/vast-evidence')
          out=Path('.cache/VAST-1508249-evidence.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():z.write(p,'VAST-1508249/'+str(p.relative_to(root)))
          digest=hashlib.sha256(out.read_bytes()).hexdigest()
          print('::notice title=VAST durable evidence::'+json.dumps(dict(file=out.name,sha256=digest,bytes=out.stat().st_size)))
          Path('.cache/VAST-1508249-evidence.zip.sha256').write_text(digest+'  '+out.name+'\n')
          PY
          gh release upload smarted-vast-only-46078577850-1 .cache/VAST-1508249-evidence.zip .cache/VAST-1508249-evidence.zip.sha256 .cache/vast-evidence/exibir.diff
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vast-durable-evidence
          path: |
            .cache/VAST-1508249-evidence.zip*
            .cache/vast-evidence/*.log
          retention-days: 30
